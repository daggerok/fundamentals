# =============================================================================
# Fundamentals — SEC company_tickers static cache (GitHub Action)
# -----------------------------------------------------------------------------
# INFRASTRUCTURE. Mirrors options-desk update-data workflow (uv + Python).
#   1. uv run scripts/fetch_data.py → data/company_tickers.json + data/index.json
#   2. Commit refreshed data/ back to the repo for GitHub Pages.
# =============================================================================
name: Update SEC data

on:
  schedule:
    - cron: "0 3 * * 1-5"   # weekdays at 03:00 UTC
    - cron: "0 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Fetch company_tickers (SEC EDGAR)
        run: uv run python scripts/fetch_data.py

      - name: Commit refreshed data
        run: |
          git config user.name  "Maksim Kostromin"
          git config user.email "daggerok@gmail.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): refresh company_tickers.json (SEC EDGAR)"
            git push || echo "Push failed (may be up-to-date or race condition)"
          fi
