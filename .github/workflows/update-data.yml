# Fundamentals — SEC static cache (options-desk coverage-first)
# uv run scripts/fundamentals-data.py → data/fundamentals/company_tickers.json + data/fundamentals/{TICKER}.json + index.json
name: Update SEC data

on:
  schedule:
    # # Every day (0-6, Sun-Sat), staggered six times per hour (UTC).
    # - cron: "0 0-3 * * 0-6"
    # - cron: "1 4-7 * * 0-6"
    # - cron: "2 8-11 * * 0-6"
    # - cron: "3 12-15 * * 0-6"
    # - cron: "5 16-19 * * 0-6"
    # - cron: "8 20-23 * * 0-6"
    # - cron: "13 0-23 * * 0-6"
    # - cron: "21 0-23 * * 0-6"
    # - cron: "34 0-23 * * 0-6"
    # - cron: "45 0-23 * * 0-6"
    # - cron: "55 0-23 * * 0-6"
    - cron: "30 9 * * 0-6"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      MAX_FETCHES: "500"
      MAX_RETRIES: "2"
      REQUEST_SLEEP: "0.5"
      SKIP_FRESH_HOURS: "24"
      # UNIVERSE_SIZE: "0"   # 0 = all company_tickers; set e.g. 500 to limit
      # TICKERS: "AAPL MSFT" # optional explicit list
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # This job only needs the current tree and a minimal history for its push.
          fetch-depth: 2

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Prefetch SEC static cache (coverage-first)
        run: TICKERS=$(cat data/All.txt) uv run python scripts/fundamentals-data.py

      - name: Commit and push refreshed data
        id: push
        run: |
          git config user.name  "Maksim Kostromin"
          git config user.email "daggerok@gmail.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): refresh SEC static cache"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not emit a push workflow run. Dispatch
      # CI explicitly so refreshed data commits are validated as well.
      - name: Trigger CI for refreshed data
        if: steps.push.outputs.pushed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yaml/dispatches \
            -d "{\"ref\":\"${TARGET_BRANCH}\"}"
