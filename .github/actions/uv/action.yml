name: 'uv setup'
description: 'Shared setup for python uv'
inputs:
  enable-cache:
    description: 'Enable caching of the uv cache directory'
    required: false
    default: 'true'
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.13'
runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: ${{ inputs.enable-cache }}
        python-version: ${{ inputs.python-version }}
