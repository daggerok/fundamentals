name: 'uv setup'
description: 'Shared setup for python uv'
inputs:
  enable-cache:
    description: 'Enable caching of the uv cache directory'
    required: false
    default: 'true'
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.13'
runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: ${{ inputs.enable-cache }}
        python-version: ${{ inputs.python-version }}
