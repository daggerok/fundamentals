<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEC EDGAR Financial Dashboard (React)</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

    <style>
        body { background-color: #0f172a; color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div id="root" class="max-w-6xl mx-auto"></div>

    <script type="text/babel" data-presets="react">
        const { useState } = React;

        const CONCEPT_MAP = {
            revenue: ['RevenueFromContractWithCustomerExcludingAssessedTax', 'Revenues', 'SalesRevenueNet', 'SalesRevenueGoodsNet'],
            netIncome: ['NetIncomeLoss', 'NetIncomeLossAvailableToCommonStockholdersBasic', 'ProfitLoss'],
            operatingCashFlow: ['NetCashProvidedByUsedInOperatingActivities', 'NetCashProvidedByUsedInOperatingActivitiesContinuingOperations'],
            capex: ['PaymentsToAcquirePropertyPlantAndEquipment', 'PaymentsForCapitalImprovements']
        };

        const PROXY_BASE = "http://localhost:8010/proxy";

        function getFinancialMetric(apiResponse, conceptKeys) {
            if (!apiResponse || !apiResponse.facts || !apiResponse.facts['us-gaap']) return [];
            
            const gaapData = apiResponse.facts['us-gaap'];
            let combinedData = [];
            
            for (const key of conceptKeys) {
                const metric = gaapData[key];
                if (metric?.units?.USD) {
                    const annualData = metric.units.USD.filter(p => p.form === "10-K" && p.fp === "FY");
                    combinedData = combinedData.concat(annualData);
                }
            }

            const uniqueByYear = [];
            const seenYears = new Set();
            
            for (let i = combinedData.length - 1; i >= 0; i--) {
                const item = combinedData[i];
                if (!seenYears.has(item.fy)) {
                    seenYears.add(item.fy);
                    uniqueByYear.push(item);
                }
            }
            return uniqueByYear;
        }

        const formatCurrency = (val) => {
            if (val === undefined || val === null) return <span className="text-slate-600">—</span>;
            return new Intl.NumberFormat('en-US').format(parseFloat((val / 1_000_000).toFixed(1)));
        };

        const App = () => {
            const [inputValue, setInputValue] = useState("AVGO");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            
            const [companyInfo, setCompanyInfo] = useState(null);
            const [financialData, setFinancialData] = useState([]);

            const loadData = async () => {
                const ticker = inputValue.trim().toUpperCase();
                
                setError(null);
                setCompanyInfo(null);
                setFinancialData([]);
                
                if (!ticker) {
                    setError("Пожалуйста, введите тикер.");
                    return;
                }

                setLoading(true);

                try {
                    const tickerMapResponse = await fetch('./company_tickers.json');
                    if (!tickerMapResponse.ok) {
                        throw new Error("Не удалось прочитать 'company_tickers.json'. Убедитесь, что файл скачан и лежит рядом с index.html.");
                    }
                    
                    const tickerMap = await tickerMapResponse.json();
                    const targetCompany = Object.values(tickerMap).find(c => c.ticker === ticker);

                    if (!targetCompany) {
                        throw new Error(`Тикер "${ticker}" не найден в официальной базе SEC.`);
                    }

                    const paddedCik = String(targetCompany.cik_str).padStart(10, '0');

                    const factsResponse = await fetch(`${PROXY_BASE}/api/xbrl/companyfacts/CIK${paddedCik}.json`);

                    if (!factsResponse.ok) {
                        throw new Error(`Ошибка сервера (Код: ${factsResponse.status}). Убедитесь, что запущен прокси с флагом --headers.`);
                    }
                    
                    const factsData = await factsResponse.json();

                    const revData = getFinancialMetric(factsData, CONCEPT_MAP.revenue);
                    const netIncData = getFinancialMetric(factsData, CONCEPT_MAP.netIncome);
                    const ocfData = getFinancialMetric(factsData, CONCEPT_MAP.operatingCashFlow);
                    const capexData = getFinancialMetric(factsData, CONCEPT_MAP.capex);

                    const allMetrics = [...revData, ...netIncData, ...ocfData, ...capexData];
                    const rawYears = allMetrics.map(d => d.fy);
                    const yearsList = Array.from(new Set(rawYears)).sort((a, b) => b - a);

                    const processedData = yearsList.map(year => {
                        const rev = revData.find(d => d.fy === year)?.val;
                        const net = netIncData.find(d => d.fy === year)?.val;
                        const ocf = ocfData.find(d => d.fy === year)?.val;
                        const capex = capexData.find(d => d.fy === year)?.val;
                        const fcf = (ocf !== undefined && capex !== undefined) ? (ocf - capex) : undefined;
                        
                        return { year, rev, net, ocf, capex, fcf };
                    });

                    setCompanyInfo({ title: targetCompany.title, cik: paddedCik });
                    setFinancialData(processedData);

                } catch (err) {
                    setError(err.message || "Произошла неизвестная ошибка.");
                } finally {
                    setLoading(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') loadData();
            };

            return (
                <React.Fragment>
                    <header className="mb-8 text-center md:text-left">
                        <h1 className="text-3xl font-bold bg-gradient-to-r from-emerald-400 to-teal-500 bg-clip-text text-transparent">
                            data.sec.gov
                        </h1>
                        <p className="text-slate-400 mt-2 text-sm font-mono">
                            requires: bunx local-cors-proxy --proxyUrl https://data.sec.gov
                        </p>
                    </header>

                    <div className="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700/50 mb-8">
                        <div className="flex flex-col md:flex-row gap-4 items-center">
                            <div className="flex-1 w-full">
                                <input 
                                    type="text" 
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                    placeholder="TICKER" 
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-emerald-400 font-mono font-bold focus:outline-none focus:border-emerald-500 transition-colors uppercase"
                                />
                            </div>
                            <button 
                                onClick={loadData}
                                disabled={loading}
                                title="Load Data" 
                                className="w-full md:w-auto flex justify-center items-center bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-900 font-bold px-6 py-3 rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-6 h-6">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                                </svg>
                            </button>
                        </div>
                        
                        {companyInfo && !loading && (
                            <div className="mt-3 text-sm text-slate-300 font-medium">
                                {companyInfo.title} (SEC CIK: {companyInfo.cik})
                            </div>
                        )}
                    </div>

                    {error && (
                        <div className="bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl mb-8 text-sm font-medium">
                            {error}
                        </div>
                    )}

                    {loading && (
                        <div className="text-center py-12">
                            <div className="animate-spin inline-block w-8 h-8 border-4 border-current border-t-transparent text-emerald-500 rounded-full mb-4"></div>
                        </div>
                    )}

                    {companyInfo && !loading && (
                        <div className="bg-slate-800 rounded-2xl border border-slate-700/50 overflow-hidden shadow-xl animate-fade-in">
                            <div className="p-6 border-b border-slate-700/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                <h3 className="font-bold text-lg">Сводные годовые финансовые показатели (FY)</h3>
                                <p className="text-xs text-slate-400">В миллионах USD</p>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-900/50 text-slate-400 text-xs font-semibold uppercase tracking-wider border-b border-slate-700/30">
                                            <th className="p-4">Финансовый год</th>
                                            <th className="p-4 text-right">Выручка (Revenue)</th>
                                            <th className="p-4 text-right">Чистая прибыль (Net Income)</th>
                                            <th className="p-4 text-right">Cash Flow (Ops)</th>
                                            <th className="p-4 text-right">CapEx</th>
                                            <th className="p-4 text-right text-emerald-400">Free Cash Flow</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700/30 text-sm font-mono">
                                        {financialData.length === 0 ? (
                                            <tr>
                                                <td colSpan="6" className="p-4 text-center text-slate-500">
                                                    Нет годовых данных US-GAAP для этого тикера.
                                                </td>
                                            </tr>
                                        ) : (
                                            financialData.map((row) => (
                                                <tr key={row.year} className="hover:bg-slate-700/20 transition-colors border-b border-slate-700/20">
                                                    <td className="p-4 font-semibold text-slate-300">{row.year}</td>
                                                    <td className="p-4 text-right text-slate-100">{formatCurrency(row.rev)}</td>
                                                    <td className={`p-4 text-right ${row.net !== undefined && row.net < 0 ? 'text-red-400' : 'text-slate-100'}`}>
                                                        {formatCurrency(row.net)}
                                                    </td>
                                                    <td className="p-4 text-right text-slate-300">{formatCurrency(row.ocf)}</td>
                                                    <td className="p-4 text-right text-slate-400">{formatCurrency(row.capex)}</td>
                                                    <td className="p-4 text-right text-emerald-400 font-bold">{formatCurrency(row.fcf)}</td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        };

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        }
    </script>
</body>
</html>
